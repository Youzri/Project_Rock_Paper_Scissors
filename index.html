<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissor</title>
    <script type="module" src="script.js"></script>
</head>
<body>
    <section class="gameContainer">
        <header class="header">
            <div class="topNav">
                <div class="statusBadge"></div>
                <div class="howtowin"></div>
            </div>
            <div class="mainScoreBoard">
                <div class="scores">
                    <div class="skynetSide">
                        <div class="skynet name"></div>
                        <div class="skynet score"></div>
                        <div class="aiCore"></div>
                    </div>
                    <div class="vsDivision">
                        <div class="vs"></div>
                        <div class="divider"></div>
                        <div class="roundNumber"></div>
                    </div>
                    <div class="humanSide">
                        <div class="human name"></div>
                        <div class="human score"></div>
                        <div class="player"></div>                        
                    </div>
                </div>
                <div class="banner">
                    <div class="text"></div>
                </div>
            </div>
        </header>
        <main class="arena">
            <div class="mainContainer">
                <div class="fighterArena">
                    <div class="humanFighterSide">
                        <div class="human"></div>
                        <div class="humanIcon"></div>
                        <div class="humanfightStatus"></div>
                    </div>
                    <div class="clashCenterIndicator">
                        <div class="clashCircle"></div>
                        <div class="standby"></div>
                    </div>
                    <div class="skynetFighterSide">
                        <div class="skynet"></div>
                        <div class="skynetIcom"></div>
                        <div class="skynetfightStatus"></div>                        
                    </div>
                </div>
                <div class="clashBanner">
                    <div class="bannerContainer">
                        <div class="text"></div>
                    </div>
                </div>
            </div>
        </main>
        <section class="weapons">
            <div class="top">
                <div class="left"></div>
                <div class="right"></div>
            </div>
            <div class="bottom">
                <div class="rockButton">
                    <div class="shape"></div>
                    <div class="shapeName"></div>
                    <div class="shapeAction"></div>
                </div>
                <div class="paperButton">
                    <div class="shape"></div>
                    <div class="shapeName"></div>
                    <div class="shapeAction"></div>                    
                </div>
                <div class="scissorsButton">
                    <div class="shape"></div>
                    <div class="shapeName"></div>
                    <div class="shapeAction"></div>                    
                </div>
            </div>
        </section>
        <footer class="controls">
            <div class="buttonLeft"></div>
            <div class="buttonMid"></div>
            <div class="buttonRight"></div>
        </footer>
        <div class="rightsReserved"></div>
    </section>
    
</body>
</html>
