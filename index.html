<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissor</title>
    <script type="module" src="script.js"></script>
</head>
<body>
    <section class="gameContainer">
        <header class="header">
            <div class="topNav">
                <div class="statusBadge"></div>
                <div class="howtowin"></div>
            </div>
            <div class="mainScoreBoard">
                <div class="scores">
                    <div class="skynetSide">
                        <div class="skynet name"></div>
                        <div class="skynet score"></div>
                        <div class="aiCore"></div>
                    </div>
                    <div class="vsDivision">
                        <div class="vs"></div>
                        <div class="divider"></div>
                        <div class="roundNumber"></div>
                    </div>
                    <div class="humanSide">
                        <div class="human name"></div>
                        <div class="human score"></div>
                        <div class="player"></div>                        
                    </div>
                </div>
                <div class="banner"></div>
            </div>
        </header>
        <main class="arena">

        </main>
        <section class="weapons"></section>
        <footer class="controls"></footer>
    </section>
    
</body>
</html>
